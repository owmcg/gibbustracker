<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibraltar Bus Tracker - Live Bus Locations</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #3498db;
        }

        .routes-section {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .routes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .route-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .route-card:hover {
            border-color: #3498db;
            transform: scale(1.02);
        }

        .route-card.active {
            border-color: #27ae60;
            background: #d4edda;
        }

        .route-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .route-status {
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .map-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        #map {
            height: 500px;
            border-radius: 10px;
        }

        .bus-list {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .bus-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid #3498db;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
        }

        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .refresh-btn:hover {
            background: #2980b9;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .header {
                padding: 1rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            #map {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-bus"></i> Gibraltar Bus Tracker</h1>
        <div class="subtitle">Real-time bus locations and route information</div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3><i class="fas fa-bus"></i> Active Buses</h3>
                <div class="stat-value" id="activeBuses">-</div>
            </div>
            <div class="stat-card">
                <h3><i class="fas fa-route"></i> Routes Running</h3>
                <div class="stat-value" id="activeRoutes">-</div>
            </div>
            <div class="stat-card">
                <h3><i class="fas fa-clock"></i> Last Updated</h3>
                <div class="stat-value" id="lastUpdate">-</div>
            </div>
            <div class="stat-card">
                <h3><i class="fas fa-refresh"></i> Auto Refresh</h3>
                <button class="refresh-btn" onclick="refreshData()">Refresh Now</button>
            </div>
        </div>

        <div class="routes-section">
            <h2><i class="fas fa-map-signs"></i> Gibraltar Bus Routes</h2>
            <div class="routes-grid" id="routesGrid">
                <!-- Routes will be populated here -->
            </div>
        </div>

        <div class="map-container">
            <h2><i class="fas fa-map"></i> Live Bus Map</h2>
            <div id="map"></div>
        </div>

        <div class="bus-list">
            <h2><i class="fas fa-list"></i> Active Buses</h2>
            <div id="busList" class="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading bus data...
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Data provided by Gibraltar Bus Service | <a href="https://github.com/owmcg/gibbustracker" style="color: rgba(255,255,255,0.9);">View on GitHub</a></p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Gibraltar Bus Routes
        const routes = ['1', '2', '3', '7', '8', '9', 'N1', 'N8E', 'N8S'];
        let map;
        let busMarkers = [];
        let busData = {};

        // Initialize map
        function initMap() {
            map = L.map('map').setView([36.1408, -5.3536], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        // Fetch bus data from Gibraltar API
        async function fetchBusData(routeId) {
            try {
                const response = await fetch(`https://track.bus.gi/busTracker.php?id=${routeId}`);
                const html = await response.text();
                
                // Parse the HTML response
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const images = doc.querySelectorAll('img[src*="c"]');
                
                const buses = [];
                images.forEach(img => {
                    const src = img.src;
                    const busIdMatch = src.match(/c(\w+)\.png/);
                    if (busIdMatch) {
                        const busId = busIdMatch[1];
                        const style = img.style.cssText;
                        const leftMatch = style.match(/left:\s*(\d+(?:\.\d+)?)px/);
                        const topMatch = style.match(/top:\s*(\d+(?:\.\d+)?)px/);
                        
                        if (leftMatch && topMatch) {
                            buses.push({
                                id: busId,
                                route: routeId,
                                x: parseFloat(leftMatch[1]),
                                y: parseFloat(topMatch[1]),
                                timestamp: new Date().toISOString()
                            });
                        }
                    }
                });
                
                return buses;
            } catch (error) {
                console.error(`Error fetching route ${routeId}:`, error);
                return [];
            }
        }

        // Fetch all bus data
        async function fetchAllBusData() {
            const allBuses = [];
            const activeRoutes = new Set();
            
            for (const route of routes) {
                const buses = await fetchBusData(route);
                if (buses.length > 0) {
                    activeRoutes.add(route);
                    allBuses.push(...buses);
                }
            }
            
            busData = { buses: allBuses, activeRoutes: Array.from(activeRoutes) };
            return busData;
        }

        // Update map with bus locations
        function updateMap() {
            // Clear existing markers
            busMarkers.forEach(marker => map.removeLayer(marker));
            busMarkers = [];
            
            if (busData.buses) {
                busData.buses.forEach(bus => {
                    // Convert pixel coordinates to approximate lat/lng
                    // This is a rough conversion - you'd need exact map bounds for precision
                    const lat = 36.1408 + (200 - bus.y) * 0.0001;
                    const lng = -5.3536 + (bus.x - 200) * 0.0001;
                    
                    const marker = L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup(`Bus ${bus.id}<br>Route ${bus.route}<br>Updated: ${new Date(bus.timestamp).toLocaleTimeString()}`);
                    
                    busMarkers.push(marker);
                });
            }
        }

        // Update UI with bus data
        function updateUI() {
            const activeBusesEl = document.getElementById('activeBuses');
            const activeRoutesEl = document.getElementById('activeRoutes');
            const lastUpdateEl = document.getElementById('lastUpdate');
            const busListEl = document.getElementById('busList');
            const routesGridEl = document.getElementById('routesGrid');
            
            if (busData.buses) {
                activeBusesEl.textContent = busData.buses.length;
                activeRoutesEl.textContent = busData.activeRoutes.length;
                lastUpdateEl.textContent = new Date().toLocaleTimeString();
                
                // Update bus list
                if (busData.buses.length === 0) {
                    busListEl.innerHTML = '<div class="loading">No buses currently active</div>';
                } else {
                    busListEl.innerHTML = busData.buses.map(bus => `
                        <div class="bus-item">
                            <div>
                                <strong>Bus ${bus.id}</strong> - Route ${bus.route}
                            </div>
                            <div style="color: #27ae60;">
                                <i class="fas fa-circle"></i> Active
                            </div>
                        </div>
                    `).join('');
                }
                
                // Update routes grid
                routesGridEl.innerHTML = routes.map(route => `
                    <div class="route-card ${busData.activeRoutes.includes(route) ? 'active' : ''}">
                        <div class="route-number">Route ${route}</div>
                        <div class="route-status" style="color: ${busData.activeRoutes.includes(route) ? '#27ae60' : '#95a5a6'};">
                            ${busData.activeRoutes.includes(route) ? 'Active' : 'No buses'}
                        </div>
                    </div>
                `).join('');
                
                updateMap();
            }
        }

        // Refresh data
        async function refreshData() {
            const refreshBtn = document.querySelector('.refresh-btn');
            refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            refreshBtn.disabled = true;
            
            await fetchAllBusData();
            updateUI();
            
            refreshBtn.innerHTML = 'Refresh Now';
            refreshBtn.disabled = false;
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', async function() {
            initMap();
            await refreshData();
            
            // Auto-refresh every 30 seconds
            setInterval(refreshData, 30000);
        });
    </script>
</body>
</html>
