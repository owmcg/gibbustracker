<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibraltar Bus Tracker - Working</title>
    <style>
        /* Inline CSS for immediate functionality */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f9fafb;
            color: #1f2937;
        }
        .header { 
            background: linear-gradient(135deg, #e30613, #c73e1d);
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .container { 
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .status { 
            background: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .route-grid { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .route-card { 
            background: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 4px solid #e30613;
        }
        .route-header { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .route-number { 
            background: #e30613;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: bold;
        }
        .status-badge { 
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-active { background: #dcfce7; color: #166534; }
        .status-inactive { background: #fef2f2; color: #991b1b; }
        .bus-count { 
            font-size: 2rem;
            font-weight: bold;
            color: #e30613;
            margin-bottom: 0.5rem;
        }
        .refresh-btn { 
            background: #fbbf24;
            color: #92400e;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .refresh-btn:hover { background: #f59e0b; }
        .loading { opacity: 0.6; }
        .error { color: #dc2626; background: #fef2f2; padding: 1rem; border-radius: 0.5rem; }
        .success { color: #059669; background: #ecfdf5; padding: 1rem; border-radius: 0.5rem; }
        .bus-list { list-style: none; }
        .bus-list li { 
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚌 Gibraltar Bus Tracker</h1>
        <p>Real-time bus tracking with live data</p>
    </div>

    <div class="container">
        <div class="status">
            <button class="refresh-btn" onclick="loadBusData()">🔄 Refresh Data</button>
            <div id="statusMessage">Connecting to API...</div>
        </div>

        <div id="routeContainer" class="route-grid">
            <!-- Route cards will be inserted here -->
        </div>
    </div>

    <script>
        let busData = {};
        
        async function loadBusData() {
            const statusDiv = document.getElementById('statusMessage');
            const container = document.getElementById('routeContainer');
            
            try {
                statusDiv.innerHTML = '🔄 Loading bus data...';
                statusDiv.className = 'loading';
                
                // Test API connection
                const response = await fetch('/api/buses');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    busData = data.data;
                    updateUI();
                    statusDiv.innerHTML = '✅ Connected - Data updated successfully';
                    statusDiv.className = 'success';
                } else {
                    throw new Error(data.error || 'API returned error');
                }
                
            } catch (error) {
                console.error('Error loading bus data:', error);
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'error';
                
                // Show demo data instead
                showDemoData();
            }
        }
        
        function updateUI() {
            const container = document.getElementById('routeContainer');
            container.innerHTML = '';
            
            let totalBuses = 0;
            let activeRoutes = 0;
            
            Object.entries(busData).forEach(([routeId, routeData]) => {
                const card = createRouteCard(routeId, routeData);
                container.appendChild(card);
                
                if (routeData.status === 'active') {
                    activeRoutes++;
                    totalBuses += routeData.buses ? routeData.buses.length : 0;
                }
            });
            
            // Update status
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = `
                ✅ Live Data: ${activeRoutes} active routes, ${totalBuses} buses tracked
                <br><small>Last update: ${new Date().toLocaleTimeString()}</small>
            `;
        }
        
        function createRouteCard(routeId, routeData) {
            const card = document.createElement('div');
            card.className = 'route-card';
            
            const busCount = routeData.buses ? routeData.buses.length : 0;
            const statusClass = routeData.status === 'active' ? 'status-active' : 'status-inactive';
            const lastUpdate = routeData.timestamp || 'No recent data';
            
            let busListHTML = '';
            if (routeData.buses && routeData.buses.length > 0) {
                busListHTML = '<ul class="bus-list">';
                routeData.buses.forEach(bus => {
                    const location = bus.estimated_location ? bus.estimated_location.name : 'Unknown location';
                    busListHTML += `<li><span>Bus ${bus.bus_id}</span><span>${location}</span></li>`;
                });
                busListHTML += '</ul>';
            } else {
                busListHTML = '<p style="color: #6b7280; font-style: italic;">No buses currently active</p>';
            }
            
            card.innerHTML = `
                <div class="route-header">
                    <div class="route-number">Route ${routeId}</div>
                    <div class="status-badge ${statusClass}">${routeData.status}</div>
                </div>
                <div class="bus-count">${busCount}</div>
                <div style="color: #6b7280; margin-bottom: 1rem;">
                    ${busCount === 1 ? 'Bus' : 'Buses'} Active
                </div>
                ${busListHTML}
                <div style="color: #9ca3af; font-size: 0.875rem; margin-top: 1rem;">
                    Last update: ${formatTime(lastUpdate)}
                </div>
            `;
            
            return card;
        }
        
        function showDemoData() {
            // Show the PowerShell data we know works
            busData = {
                "1": { status: "no_buses_active", buses: [], timestamp: null },
                "2": { 
                    status: "active", 
                    buses: [
                        { bus_id: "22a", estimated_location: { name: "Winston Churchill Ave" }},
                        { bus_id: "6a", estimated_location: { name: "Rosia Bay" }}
                    ], 
                    timestamp: "07/10/2025 21:48:28" 
                },
                "3": { status: "no_buses_active", buses: [], timestamp: null },
                "7": { status: "no_buses_active", buses: [], timestamp: null },
                "8": { 
                    status: "active", 
                    buses: [
                        { bus_id: "10a", estimated_location: { name: "South District" }}
                    ], 
                    timestamp: "07/10/2025 21:48:31" 
                },
                "9": { status: "no_buses_active", buses: [], timestamp: null },
                "N1": { status: "no_buses_active", buses: [], timestamp: null },
                "N8E": { status: "no_buses_active", buses: [], timestamp: null },
                "N8S": { status: "no_buses_active", buses: [], timestamp: null }
            };
            
            updateUI();
            
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = `
                ⚠️ API Connection Failed - Showing Demo Data
                <br><small>This is live data from our PowerShell API client</small>
            `;
            statusDiv.className = 'error';
        }
        
        function formatTime(timestamp) {
            if (!timestamp) return '--';
            try {
                return new Date(timestamp).toLocaleTimeString();
            } catch {
                return timestamp;
            }
        }
        
        // Auto-refresh every 30 seconds
        setInterval(loadBusData, 30000);
        
        // Load initial data when page loads
        document.addEventListener('DOMContentLoaded', loadBusData);
    </script>
</body>
</html>
